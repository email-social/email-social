name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for the browser and end-to-end tests
        # Install with the playwright CLI of exactly the playwright-core
        # version the tests use, so the Chromium revision it
        # downloads is the one playwright-core launches.
        working-directory: packages/es-core
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('playwright-core/package.json').version")
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium
      - run: npm run test:browser
      - name: End-to-end tests (web client in Chromium against the bridge, and the email-social command)
        run: npm run test:e2e
